appId: local.waturbo.app
productName: WA Turbo
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: migrations
    to: migrations
# Each platform ships its own Postgres build into resources/postgres.
mac:
  extraResources:
    - from: vendor/postgres      # built by scripts/prepare-postgres.mjs
      to: postgres
  target:
    - target: dmg
      arch: [arm64]
  identity: "-"          # ad-hoc signature, enough for this Mac
  hardenedRuntime: false  # only needed for notarized distribution
  category: public.app-category.productivity
  icon: build/icon.png
  extendInfo:
    LSMinimumSystemVersion: "13.0"
dmg:
  title: WA Turbo
toolsets:
  nsis: "1.2.1"   # NSIS 3.12 bundle: has a native Apple Silicon makensis, so the installer builds on this Mac
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  extraResources:
    - from: vendor/postgres-win32-x64   # built by scripts/prepare-postgres-win.mjs
      to: postgres
nsis:
  oneClick: true           # per-user install, no admin prompt (the bundled Postgres refuses to run elevated)
  perMachine: false
  deleteAppDataOnUninstall: false   # chats and the database stay unless removed by hand
  artifactName: ${productName}-${version}-x64-setup.${ext}
  shortcutName: WA Turbo
